plugins { id 'com.android.application' }
android {
    namespace 'com.solutera.dilinkinspector'
    compileSdk 35
    defaultConfig { applicationId 'com.solutera.dilinkinspector'; minSdk 23; targetSdk 32; versionCode 21; versionName '2.9.0' }
    signingConfigs {
        personal { storeFile rootProject.file('inspector-local.p12'); storePassword 'inspector-local'; keyAlias 'inspector'; keyPassword 'inspector-local' }
    }
    buildTypes { debug { signingConfig signingConfigs.personal }; release { signingConfig signingConfigs.personal; minifyEnabled false } }
    sourceSets { main.java.srcDirs += '../vendor/libadb-src'; main.assets.srcDirs += '../vendor/notice-assets' }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
    packaging { resources.excludes += ['META-INF/versions/**', 'META-INF/*.SF', 'META-INF/*.RSA', 'META-INF/*.DSA'] }
}
dependencies {
    compileOnly files('../vendor/annotation-1.3.0.jar')
    implementation files('../vendor/bcprov-jdk15to18-1.81.jar', '../vendor/bcpkix-jdk15to18-1.81.jar', '../vendor/bcutil-jdk15to18-1.81.jar', '../vendor/conscrypt-android-2.5.3.aar', '../vendor/spake2-android-2.2.1.aar')
}
